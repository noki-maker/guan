<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="先天太极图（阴阳鱼）">
  <title>先天太极图（阴阳鱼）</title>
  <!--
    画法：外圆为「太极」（圆心 60,60、半径 54）。
    黑白双鱼的分界线由两段半径 27（即 R/2）的半圆弧拼成：
      由最下点 60,114 上行至圆心 60,60，向左鼓出   → 黑鱼头（在下）的左半边轮廓
      由圆心 60,60 上行至最上点 60,6，向右鼓出     → 白鱼头（在上）的右半边轮廓
    于是黑鱼 = 右半圆 + 下方小圆，白鱼 = 左半圆 + 上方小圆，首尾相衔。
    两眼与所在鱼头颜色相反：白鱼点黑眼、黑鱼点白眼，示「阴中有阳、阳中有阴」。
    本图为独立文件、纯色无渐变，用 <img> 引用即可，不受页面样式影响。
  -->
  <circle cx="60" cy="60" r="54" fill="#fffdf8" stroke="#2b2620" stroke-width="2"/>
  <path d="M60 6 a54 54 0 0 1 0 108 a27 27 0 0 1 0-54 a27 27 0 0 0 0-54" fill="#2b2620"/>
  <circle cx="60" cy="33" r="6" fill="#2b2620"/>
  <circle cx="60" cy="87" r="6" fill="#fffdf8"/>
</svg>
